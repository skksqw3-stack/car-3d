name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the project
      run: |
        unzip -q CarRacing3D-Kotlin-Android.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        # پیدا کردن فایل gradlew در پوشه استخراج شده
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "خطا: فایل gradlew پیدا نشد. آیا مطمئن هستید فایل های مخفی در زیپ هستند؟"
          exit 1
        fi
        
        chmod +x "$GRADLEW_PATH"

    - name: Build with Gradle
      run: |
        # پیدا کردن پوشه‌ای که فایل build.gradle در آن قرار دارد
        BUILD_GRADLE_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
        
        if [ -z "$BUILD_GRADLE_PATH" ]; then
          echo "خطا: فایل build.gradle پیدا نشد."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
        echo "پروژه در مسیر زیر پیدا شد: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarRacing3D-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
