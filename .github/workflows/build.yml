name: Build APK from Zip (Without gradlew)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the project
      run: |
        # نام فایل زیپ جدید شما
        unzip -q CarRacing3D-Kotlin-Android-RealCars.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle (System)
      uses: gradle/actions/setup-gradle@v3

    - name: Build with System Gradle
      run: |
        # پیدا کردن پوشه‌ای که فایل build.gradle در آن قرار دارد
        BUILD_GRADLE_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
        
        if [ -z "$BUILD_GRADLE_PATH" ]; then
          echo "خطا: فایل build.gradle پیدا نشد."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
        echo "پروژه در مسیر زیر پیدا شد: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        
        # اجرای Gradle با JDK 17 و نادیده گرفتن ناسازگاری JVM
        gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarRacing3D-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
