name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the Godot project
      run: |
        unzip -q SpeedRacer-Godot-4.7.2-Upgrade.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create export_presets.cfg (اگر وجود ندارد)
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        if [ ! -f "export_presets.cfg" ]; then
          echo "فایل export_presets.cfg وجود ندارد. ساخت فایل پیش‌فرض..."
          cat <<EOF > export_presets.cfg
        [preset.0]
        name="Android"
        platform="Android"
        runnable=true
        advanced_options=false
        dedicated_server=false
        custom_features=""
        export_filter="all_resources"
        include_filter=""
        exclude_filter=""
        export_path="build/SpeedRacer.apk"
        script_export_mode=2

        [preset.0.options]
        custom_template/debug=""
        custom_template/release=""
        gradle_build/use_gradle_build=false
        gradle_build/export_format=0
        arch/armeabi_v7a=true
        arch/arm64_v8a=true
        arch/x86=false
        arch/x86_64=false
        version/code=1
        version/name="1.0"
        package/unique_name="com.example.speedracer"
        package/name="SpeedRacer"
        package/signed=true
        package/app_category=2
        package/retain_data_on_uninstall=false
        package/exclude_from_recents=false
        package/show_in_android_tv=false
        package/show_in_app_library=true
        package/show_as_launcher_app=false
        launcher_icons/main_192x192=""
        launcher_icons/adaptive_foreground_432x432=""
        launcher_icons/adaptive_background_432x432=""
        graphics/opengl_debug=false
        xr_features/xr_mode=0
        screen/immersive_mode=true
        screen/support_small=true
        screen/support_normal=true
        screen/support_large=true
        screen/support_xlarge=true
        user_data_backup/allow=false
        command_line/extra_args=""
        apk_expansion/enable=false
        permissions/custom_permissions=PackedStringArray()
        permissions/access_network_state=false
        permissions/internet=false
        EOF
        else
          echo "فایل export_presets.cfg از قبل وجود دارد."
        fi

    - name: Export Godot Project (Android APK)
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
        relative_project_path: ./extracted_project/GodotRacer
        export_debug: true
        archive_output: true
        verbose: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedRacer-APK
        path: |
          **/*.apk
          **/*.zip
