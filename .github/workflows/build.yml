name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # اجازه می‌دهد به صورت دستی هم اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the project
      run: |
        # نام فایل زیپ شما دقیقا همین است
        unzip -q CarRacing3D-Kotlin-Android.zip -d extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        cd extracted_project
        # پیدا کردن پوشه اصلی پروژه (چون ممکن است داخل زیپ یک پوشه دیگر باشد)
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          find . -name "gradlew" -exec chmod +x {} \;
        fi

    - name: Build with Gradle
      run: |
        cd extracted_project
        # اگر فایل gradlew در روت استخراج شده است:
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          # پیدا کردن مسیر gradlew و اجرای آن
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarRacing3D-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
