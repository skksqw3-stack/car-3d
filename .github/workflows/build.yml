name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the Godot project
      run: |
        unzip -q SpeedRacer-Godot-4.7.2-Upgrade.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
        cd /usr/local/lib/android/sdk/cmdline-tools
        sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        sudo unzip -q cmdline-tools.zip
        sudo mv cmdline-tools latest
        sudo rm cmdline-tools.zip
        
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Download Godot 4.5 and Export Templates
      run: |
        GODOT_VERSION="4.5"
        
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        chmod +x godot
        
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/
        unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
        mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

    - name: Generate Debug Keystore
      run: |
        keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

    - name: Configure Godot Editor Settings
      run: |
        mkdir -p ~/.config/godot
        cat <<EOF > ~/.config/godot/editor_settings-4.tres
        [gd_resource type="EditorSettings" format=3]

        [resource]
        export/android/android_sdk_path = "/usr/local/lib/android/sdk"
        export/android/debug_keystore = "$(pwd)/debug.keystore"
        export/android/debug_keystore_user = "androiddebugkey"
        export/android/debug_keystore_pass = "android"
        EOF

    - name: Generate export_presets.cfg with Godot
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        echo "--- اجرای Godot برای ساخت export_presets.cfg ---"
        # اجرای Godot در حالت ادیتور برای یک ثانیه تا فایل تنظیمات ساخته شود
        timeout 20s ~/work/car-3d/car-3d/godot --headless --editor --quit || true
        
        echo "--- بررسی وجود فایل export_presets.cfg ---"
        if [ -f "export_presets.cfg" ]; then
          echo "فایل توسط Godot ساخته شد:"
          cat export_presets.cfg
        else
          echo "Godot فایل را نساخت. ساخت دستی..."
          cat <<EOF > export_presets.cfg
        [preset.0]
        name="Android"
        platform="Android"
        runnable=true
        advanced_options=false
        dedicated_server=false
        custom_features=""
        export_filter="all_resources"
        include_filter=""
        exclude_filter=""
        export_path="build/SpeedRacer.apk"
        script_export_mode=2
        EOF
        fi

    - name: Update export_presets.cfg
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        # به‌روزرسانی مسیر خروجی و تنظیمات Keystore
        sed -i 's|export_path=".*"|export_path="build/SpeedRacer.apk"|' export_presets.cfg || true
        
        # اضافه کردن تنظیمات Keystore اگر وجود نداشت
        if ! grep -q "keystore/debug" export_presets.cfg; then
          cat <<EOF >> export_presets.cfg

        [preset.0.options]
        keystore/debug="$(pwd)/../../debug.keystore"
        keystore/debug_user="androiddebugkey"
        keystore/debug_password="android"
        gradle_build/use_gradle_build=false
        arch/armeabi_v7a=true
        arch/arm64_v8a=true
        arch/x86=false
        arch/x86_64=false
        package/unique_name="com.example.speedracer"
        package/name="SpeedRacer"
        package/signed=true
        EOF
        fi
        
        echo "--- محتوای نهایی export_presets.cfg ---"
        cat export_presets.cfg

    - name: Build APK
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        mkdir -p build
        
        echo "--- اجرای دستور Export ---"
        ~/work/car-3d/car-3d/godot --headless --export-debug "Android" build/SpeedRacer.apk 2>&1 | tee godot_export.log
        
        echo "--- بررسی فایل خروجی ---"
        ls -la build/ || echo "پوشه build خالی است."

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Godot-Export-Logs
        path: |
          **/godot_export.log
          **/*.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedRacer-APK
        path: |
          **/*.apk
