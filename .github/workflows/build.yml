name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the Godot project
      run: |
        unzip -q SpeedRacer-Godot-4.7.2-Upgrade.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools
        cd /usr/local/lib/android/sdk/cmdline-tools
        sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        sudo unzip -q cmdline-tools.zip
        sudo mv cmdline-tools latest
        sudo rm cmdline-tools.zip
        
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Download Godot 4.5 and Export Templates
      run: |
        GODOT_VERSION="4.5"
        
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        chmod +x godot
        
        wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/
        unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
        mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

    - name: Generate Debug Keystore
      run: |
        keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

    - name: Build APK with Advanced GDScript
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        mkdir -p build
        
        # ایجاد اسکریپت پیشرفته GDScript
        cat <<'EOF' > export_script.gd
        @tool
        extends EditorScript

        func _run():
            var export_path = "res://build/SpeedRacer.apk"
            
            # ایجاد یک پریست جدید برای اندروید
            var preset = EditorExportPreset.new()
            preset.name = "Android"
            preset.platform = "Android"
            preset.runnable = true
            preset.export_filter = EditorExportPreset.EXPORT_ALL_RESOURCES
            
            # تنظیمات Keystore
            preset.set("keystore/debug", OS.get_environment("HOME") + "/debug.keystore")
            preset.set("keystore/debug_user", "androiddebugkey")
            preset.set("keystore/debug_password", "android")
            
            # تنظیم مسیر Android SDK
            preset.set("gradle_build/use_gradle_build", false)
            
            # انجام Export
            var platform = EditorExportPlatformAndroid.new()
            var err = platform.export_project(preset, export_path, false)
            
            if err == OK:
                print("✅ APK با موفقیت ساخته شد: ", export_path)
            else:
                print("❌ خطا در ساخت APK. کد خطا: ", err)
        EOF
        
        echo "--- اجرای اسکریپت Export پیشرفته ---"
        ~/work/car-3d/car-3d/godot --headless --path "$(pwd)" --script export_script.gd 2>&1 | tee godot_export.log
        
        echo "--- بررسی فایل خروجی ---"
        ls -la build/ || echo "پوشه build خالی است."

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Godot-Export-Logs
        path: |
          **/godot_export.log
          **/*.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedRacer-APK
        path: |
          **/*.apk
