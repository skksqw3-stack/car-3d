name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the project
      run: |
        unzip -q CarRacing3D-Kotlin-Android.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build with Gradle
      run: |
        # پیدا کردن مسیر فایل gradlew در هر جای پوشه استخراج شده
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "خطا: فایل gradlew در فایل زیپ پیدا نشد. لطفا مطمئن شوید فایل های مخفی پروژه (مانند gradlew و پوشه gradle) در زیپ قرار دارند."
          exit 1
        fi
        
        echo "فایل gradlew در مسیر زیر پیدا شد: $GRADLEW_PATH"
        
        # رفتن به پوشه‌ای که gradlew در آن قرار دارد
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        
        # دادن دسترسی اجرا
        chmod +x gradlew
        
        # اجرای بیلد
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarRacing3D-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
