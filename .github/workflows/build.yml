name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip the Godot project
      run: |
        unzip -q SpeedRacer-Godot-4.7.2-Upgrade.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Fix racer.gd Parse Errors
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        echo "--- محتوای خطوط ۱۴۱ و ۳۷۲ قبل از اصلاح ---"
        sed -n '141p' scripts/racer.gd
        sed -n '372p' scripts/racer.gd
        
        # اصلاح خطاها با اضافه کردن نوع صریح
        sed -i '141s/var base =/var base: Node3D =/' scripts/racer.gd || true
        sed -i '372s/var lane =/var lane: int =/' scripts/racer.gd || true
        
        echo "--- محتوای خطوط ۱۴۱ و ۳۷۲ بعد از اصلاح ---"
        sed -n '141p' scripts/racer.gd
        sed -n '372p' scripts/racer.gd

    - name: Enable ETC2/ASTC Texture Compression
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        if ! grep -q "textures/vram_compression/import_etc2_astc" "$PROJECT_FILE"; then
          echo -e "\n[rendering]\ntextures/vram_compression/import_etc2_astc=true" >> "$PROJECT_FILE"
        fi

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Export Godot Project (Android APK)
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        relative_project_path: ./extracted_project/GodotRacer
        export_debug: true
        archive_output: true
        verbose: true

    - name: Find and Verify APK
      run: |
        echo "--- جستجوی فایل‌های APK ---"
        find . -name "*.apk" -type f -exec ls -lh {} \;
        
        # کپی کردن APK به روت برای آپلود مطمئن
        find . -name "*.apk" -exec cp {} ./SpeedRacer.apk \;
        
        if [ -f "./SpeedRacer.apk" ]; then
          echo "✅ فایل APK با موفقیت پیدا شد."
          ls -lh ./SpeedRacer.apk
        else
          echo "❌ هیچ فایل APK پیدا نشد. لاگ‌ها را بررسی کنید."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedRacer-APK
        path: ./SpeedRacer.apk
