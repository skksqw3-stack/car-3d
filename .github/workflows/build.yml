name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Godot Export Templates
      run: |
        mkdir -v -p ~/.local/share/godot/export_templates/
        if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
        else
          echo "قالب‌های خروجی از قبل در مسیر صحیح هستند."
        fi

    - name: Unzip the Godot project
      run: |
        unzip -q SpeedRacer-Godot-4.7.2-Upgrade.zip -d extracted_project
        echo "--- محتوای پوشه استخراج شده ---"
        ls -la extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK (بدون sudo)
      run: |
        # در کانتینر، ما root هستیم، پس نیازی به sudo نیست
        mkdir -p /usr/local/lib/android/sdk/cmdline-tools
        cd /usr/local/lib/android/sdk/cmdline-tools
        
        # دانلود و استخراج ابزارهای خط فرمان
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip
        
        # تنظیم متغیرهای محیطی
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        # پذیرش لایسنس‌ها و نصب پکیج‌های مورد نیاز
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Generate Debug Keystore
      run: |
        keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

    - name: Configure Godot Editor Settings
      run: |
        mkdir -p ~/.config/godot
        cat <<EOF > ~/.config/godot/editor_settings-4.tres
        [gd_resource type="EditorSettings" format=3]

        [resource]
        export/android/android_sdk_path = "/usr/local/lib/android/sdk"
        export/android/debug_keystore = "$(pwd)/debug.keystore"
        export/android/debug_keystore_user = "androiddebugkey"
        export/android/debug_keystore_pass = "android"
        EOF

    - name: Create export_presets.cfg
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        cat <<EOF > export_presets.cfg
        [preset.0]
        name="Android"
        platform="Android"
        runnable=true
        advanced_options=false
        dedicated_server=false
        custom_features=""
        export_filter="all_resources"
        include_filter=""
        exclude_filter=""
        export_path="build/SpeedRacer.apk"
        script_export_mode=2

        [preset.0.options]
        custom_template/debug=""
        custom_template/release=""
        gradle_build/use_gradle_build=false
        gradle_build/export_format=0
        arch/armeabi_v7a=true
        arch/arm64_v8a=true
        arch/x86=false
        arch/x86_64=false
        version/code=1
        version/name="1.0"
        package/unique_name="com.example.speedracer"
        package/name="SpeedRacer"
        package/signed=true
        package/app_category=2
        package/retain_data_on_uninstall=false
        package/exclude_from_recents=false
        package/show_in_android_tv=false
        package/show_in_app_library=true
        package/show_as_launcher_app=false
        launcher_icons/main_192x192=""
        launcher_icons/adaptive_foreground_432x432=""
        launcher_icons/adaptive_background_432x432=""
        graphics/opengl_debug=false
        xr_features/xr_mode=0
        screen/immersive_mode=true
        screen/support_small=true
        screen/support_normal=true
        screen/support_large=true
        screen/support_xlarge=true
        user_data_backup/allow=false
        command_line/extra_args=""
        apk_expansion/enable=false
        permissions/custom_permissions=PackedStringArray()
        permissions/access_network_state=false
        permissions/internet=false
        EOF
        
        echo "--- محتوای export_presets.cfg ---"
        cat export_presets.cfg

    - name: Build APK
      run: |
        PROJECT_FILE=$(find extracted_project -name "project.godot" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        cd "$PROJECT_DIR"
        
        mkdir -p build
        
        # اجرای دستور Export با استفاده از Godot داخل Docker
        godot --headless --verbose --export-debug "Android" build/SpeedRacer.apk 2>&1 | tee godot_export.log

    - name: Upload Logs (if failed)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Godot-Export-Logs
        path: |
          **/godot_export.log
          **/*.log

    - name: Find and Rename APK
      if: success()
      run: |
        find extracted_project -name "*.apk" -exec cp {} ./SpeedRacer-Debug.apk \;
        ls -la ./SpeedRacer-Debug.apk

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SpeedRacer-APK
        path: ./SpeedRacer-Debug.apk
